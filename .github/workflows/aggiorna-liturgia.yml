name: Aggiorna liturgia del giorno

on:
  schedule:
    - cron: "30 3 * * 3"   # ogni mercoledì 03:30 UTC = 04:30 (inverno) / 05:30 (estate) in Italia
  workflow_dispatch:        # permette di lanciarlo a mano dalla scheda "Actions"

permissions:
  contents: write

concurrency:
  group: aggiorna-liturgia
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scarica la messa del giorno dalla CEI
        run: python3 scripts/fetch_liturgia.py --days 14

      - name: Salva liturgia.json se è cambiato
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add liturgia.json
          if git diff --cached --quiet; then
            echo "Nessuna modifica da salvare"
          else
            git commit -m "chore: aggiorna liturgia del giorno"
            git push
          fi